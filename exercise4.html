<!doctype html>
<html>
  <head>
    <title>Forms Assignment</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f9;
      }
      .form-container {
        background-color: #ffffff;
        padding: 20px;
        margin-bottom: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
      }
      h2 {
        margin-top: 0;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="email"],
      input[type="date"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ffff;
        border-radius: 4px;
      }
      .radio-group {
        margin-top: 5px;
      }
      .radio-group label {
        display: inline;
        font-weight: normal;
        margin-right: 15px;
      }
      button {
        background-color: #f46cc2;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #f86aa0;
      }
    </style>
  </head>
  <body>
    <!-- 1 & 2. Registration Form (POST) -->
    <div class="form-container">
      <h2>Registration Form</h2>
      <form action="INSERT_LECTURER_POST_URL_HERE" method="POST">
        <div class="form-group">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name" required />
        </div>

        <div class="form-group">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name" required />
        </div>

        <div class="form-group">
          <label>Gender:</label>
          <div class="radio-group">
            <input type="radio" id="male" name="gender" value="male" required />
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other" />
            <label for="other">Other</label>
          </div>
        </div>

        <div class="form-group">
          <label for="date_of_birth">Date of Birth:</label>
          <input type="date" id="date_of_birth" name="date_of_birth" required />
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <button type="submit">Submit Registration</button>
      </form>
    </div>

    <!-- 3. Search Form (GET) -->
    <div class="form-container">
      <h2>Search Form</h2>
      <form action="INSERT_LECTURER_GET_URL_HERE" method="GET">
        <div class="form-group">
          <label for="search_name">Search Name:</label>
          <input type="text" id="search_name" name="search_name" required />
        </div>

        <button type="submit">Search</button>
      </form>
    </div>
  </body>
</html>
